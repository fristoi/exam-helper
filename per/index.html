<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамены</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            padding: 0;
        }
        .container {
            max-width: 100%;
            margin: 0;
            background: white;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }

        /* ШАПКА (светлая) */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .header-left {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-btn {
            padding: 8px 20px;
            border: 2px solid #0b3b5c;
            border-radius: 30px;
            background: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: #0b3b5c;
        }
        .top-btn:hover {
            background: #e2e8f0;
        }
        .top-btn.active {
            background: #0b3b5c;
            color: white;
            border-color: #0b3b5c;
        }

        /* СЧЁТЧИК */
        .count-badge {
            background: #7c3aed;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
        }

        /* ВЫПАДАЮЩИЙ СПИСОК */
        .section-dropdown {
            padding: 8px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .section-dropdown select {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }

        /* ФИЛЬТР */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #0b3b5c;
        }
        .filter-btn:hover {
            background: #e2e8f0;
        }
        .filter-btn.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        /* ПОИСК */
        .search-box {
            padding: 8px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .search-box input:focus {
            border-color: #0b3b5c;
        }

        /* ОБЛАСТЬ С ВОПРОСАМИ — ГРАДИЕНТ ТОЛЬКО ЗДЕСЬ */
        .questions-wrapper {
            background: linear-gradient(145deg, #d4c4f7 0%, #a8c8f0 50%, #b8d4f5 100%);
            padding: 12px 16px;
            min-height: 100vh;
        }
        .questions-list {
            max-width: 100%;
            margin: 0;
        }
        .question-item {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(74, 44, 122, 0.08);
            border: 1px solid rgba(196, 181, 212, 0.25);
            transition: box-shadow 0.2s;
        }
        .question-item:hover {
            box-shadow: 0 4px 20px rgba(74, 44, 122, 0.12);
        }
        .punkt {
            color: #7c3aed;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .question {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .answers {
            font-size: 13px;
        }
        .answer-correct {
            color: #16a34a;
            margin-bottom: 2px;
        }
        .answer-wrong {
            color: #dc2626;
            margin-bottom: 2px;
        }
        .no-results {
            text-align: center;
            color: #4a3a5e;
            padding: 40px 0;
            font-size: 16px;
        }
        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header-left {
                justify-content: center;
            }
            .count-badge {
                text-align: center;
            }
            .top-btn {
                flex: 1;
                text-align: center;
                padding: 8px 12px;
                font-size: 13px;
            }
            .section-dropdown select {
                max-width: 100%;
            }
            .question-item {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ШАПКА -->
        <div class="header">
            <div class="header-left">
                <button class="top-btn active" data-base="ПТБ">ПТБ</button>
                <button class="top-btn" data-base="ППБ">ППБ</button>
                <button class="top-btn" data-base="ПТЭ">ПТЭ</button>
            </div>
            <div class="count-badge" id="countBadge">0 вопросов</div>
        </div>

        <!-- ВЫПАДАЮЩИЙ СПИСОК -->
        <div class="section-dropdown" id="extraBasesContainer">
            <select id="baseSelect">
                <option value="">📁 Дополнительные базы</option>
            </select>
        </div>

        <!-- ФИЛЬТР -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-source="all">📋 Все</button>
        </div>

        <!-- ПОИСК -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Найти вопрос...">
        </div>

        <!-- ОБЛАСТЬ С ВОПРОСАМИ (ГРАДИЕНТ) -->
        <div class="questions-wrapper">
            <div class="questions-list">
                <div id="questionsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ЛОГИКА (без изменений)
        // ============================================================

        let currentBase = 'ПТБ';
        let allQuestions = [];
        let currentFilter = 'all';
        let extraBases = [];

        const MAIN_BASES = ['ПТБ', 'ППБ', 'ПТЭ'];

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadBaseList();
        });

        function setupEventListeners() {
            document.querySelectorAll('.top-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentBase = this.dataset.base;
                    document.getElementById('baseSelect').value = '';
                    loadQuestionsForBase(currentBase);
                });
            });

            document.getElementById('baseSelect').addEventListener('change', function() {
                let val = this.value;
                if (val) {
                    document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
                    currentBase = val;
                    loadQuestionsForBase(val);
                }
            });

            document.getElementById('searchInput').addEventListener('input', loadQuestions);

            document.getElementById('filterBar').addEventListener('click', function(e) {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.source;
                    loadQuestions();
                }
            });
        }

        function loadBaseList() {
            fetch('bases/index.json')
                .then(r => r.json())
                .then(data => {
                    extraBases = (data.bases || []).filter(b => !MAIN_BASES.includes(b));
                    renderExtraBases();
                    loadQuestionsForBase(currentBase);
                })
                .catch(() => {
                    extraBases = [];
                    renderExtraBases();
                    loadQuestionsForBase(currentBase);
                });
        }

        function renderExtraBases() {
            let select = document.getElementById('baseSelect');
            select.innerHTML = '<option value="">📁 Дополнительные базы</option>';
            extraBases.forEach(b => {
                let opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                select.appendChild(opt);
            });
        }

        function loadQuestionsForBase(baseName) {
            fetch(`bases/${baseName}.json`)
                .then(r => r.json())
                .then(data => {
                    allQuestions = data.map(q => ({
                        ...q,
                        source: q.source || baseName
                    }));
                    renderSourceFilter();
                    loadQuestions();
                })
                .catch(() => {
                    allQuestions = [];
                    renderSourceFilter();
                    loadQuestions();
                });
        }

        function getAllSources() {
            let sources = new Set();
            allQuestions.forEach(q => {
                if (q.source) sources.add(q.source);
            });
            return Array.from(sources).sort();
        }

        function renderSourceFilter() {
            let sources = getAllSources();
            let filterBar = document.getElementById('filterBar');

            if (sources.length === 0) {
                filterBar.innerHTML = `<button class="filter-btn active" data-source="all">📋 Все</button>`;
                return;
            }

            let html = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" data-source="all">📋 Все</button>`;
            sources.forEach(source => {
                let displayName = source.length > 25 ? source.substring(0, 22) + '...' : source;
                html += `<button class="filter-btn ${currentFilter === source ? 'active' : ''}" data-source="${source}">📁 ${displayName}</button>`;
            });
            filterBar.innerHTML = html;
        }

        function formatAnswer(question) {
            if (!question) return '';
            let html = '';
            if (question.all_answers) {
                question.all_answers.forEach(a => {
                    html += `<div class="${a.correct ? 'answer-correct' : 'answer-wrong'}">${a.correct ? '✅' : '❌'} ${a.text}</div>`;
                });
            } else if (question.answer) {
                if (question.answer.includes('++')) {
                    question.answer.split('\n').forEach(line => {
                        if (line.trim().startsWith('++')) {
                            html += `<div class="answer-correct">✅ ${line.replace('++', '').trim()}</div>`;
                        }
                    });
                } else {
                    html += `<div class="answer-correct">✅ ${question.answer}</div>`;
                }
            }
            return html;
        }

        function getDeclension(count) {
            if (count % 10 === 1 && count % 100 !== 11) return 'вопрос';
            if (count % 10 >= 2 && count % 10 <= 4 && (count % 100 < 10 || count % 100 >= 20)) return 'вопроса';
            return 'вопросов';
        }

        function loadQuestions() {
            let filtered = currentFilter === 'all'
                ? allQuestions
                : allQuestions.filter(q => q.source === currentFilter);

            let search = document.getElementById('searchInput').value.toLowerCase().trim();
            if (search) {
                let searchWords = search.split(/\s+/).filter(word => word.length > 0);
                filtered = filtered.filter(q => {
                    let textToSearch = (
                        (q.punkt || '') + ' ' +
                        (q.question || '') + ' ' +
                        (q.source || '')
                    ).toLowerCase();
                    return searchWords.every(word => textToSearch.includes(word));
                });
            }

            const count = filtered.length;
            document.getElementById('countBadge').textContent = `${count} ${getDeclension(count)}`;

            let container = document.getElementById('questionsContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">📭 Нет вопросов</div>';
                return;
            }

            let html = '';
            filtered.forEach(q => {
                html += `<div class="question-item">`;
                html += `<div class="punkt">📌 ${q.punkt || ''}`;
                if (q.source) html += `<span style="color:#8a7a9e;font-size:11px;margin-left:8px;">[${q.source}]</span>`;
                html += `</div>`;
                html += `<div class="question">❓ ${q.question}</div>`;
                html += `<div class="answers">${formatAnswer(q)}</div>`;
                html += `</div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
