<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамены</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            padding: 0;
        }
        .container {
            max-width: 100%;
            margin: 0;
            background: white;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .top-btn {
            padding: 8px 20px;
            border: 2px solid #0b3b5c;
            border-radius: 30px;
            background: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-btn:hover {
            background: #e2e8f0;
        }
        .top-btn.active {
            background: #0b3b5c;
            color: white;
        }

        .section-dropdown {
            padding: 8px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .section-dropdown select {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: #e2e8f0;
        }
        .filter-btn.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .search-box {
            padding: 8px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #0b3b5c;
        }

        .questions-list {
            background: #f8fafc;
            padding: 8px 12px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #64748b;
            padding: 4px 0 8px;
        }
        .count-badge {
            font-weight: 600;
            color: #0b3b5c;
        }
        .question-item {
            background: white;
            border: 1px solid #e9edf2;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
        }
        .punkt {
            color: #2563eb;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .question {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .answers {
            font-size: 13px;
        }
        .answer-correct {
            color: #28a745;
        }
        .answer-wrong {
            color: #dc3545;
        }
        .no-results {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ШАПКА: только 3 кнопки -->
        <div class="header">
            <button class="top-btn active" data-base="ПТБ">ПТБ</button>
            <button class="top-btn" data-base="ППБ">ППБ</button>
            <button class="top-btn" data-base="ПТЭ">ПТЭ</button>
        </div>

        <!-- ВЫПАДАЮЩИЙ СПИСОК (только дополнительные базы) -->
        <div class="section-dropdown" id="extraBasesContainer">
            <select id="baseSelect">
                <option value="">📁 Дополнительные базы</option>
            </select>
        </div>

        <!-- ФИЛЬТР ПО ИСТОЧНИКАМ -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-source="all">📋 Все</button>
        </div>

        <!-- ПОИСК -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Найти вопрос...">
        </div>

        <!-- СПИСОК ВОПРОСОВ -->
        <div class="questions-list">
            <div class="list-header">
                <span>Вопросы</span>
                <span class="count-badge" id="questionCount">0</span>
            </div>
            <div id="questionsContainer"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // ПЕРСОНАЛЬНАЯ СТРАНИЦА - 3 КНОПКИ + ВЫПАДАЮЩИЙ СПИСОК
        // В выпадающем списке ТОЛЬКО дополнительные базы (не ПТБ/ППБ/ПТЭ)
        // ============================================================

        let currentBase = 'ПТБ';
        let allQuestions = [];
        let currentFilter = 'all';
        let extraBases = []; // только дополнительные базы

        const MAIN_BASES = ['ПТБ', 'ППБ', 'ПТЭ'];

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadBaseList();
        });

        function setupEventListeners() {
            // Кнопки ПТБ/ППБ/ПТЭ
            document.querySelectorAll('.top-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentBase = this.dataset.base;
                    // Сбрасываем выпадающий список
                    document.getElementById('baseSelect').value = '';
                    loadQuestionsForBase(currentBase);
                });
            });

            // Выпадающий список (только дополнительные базы)
            document.getElementById('baseSelect').addEventListener('change', function() {
                let val = this.value;
                if (val) {
                    // Снимаем активность с основных кнопок
                    document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
                    currentBase = val;
                    loadQuestionsForBase(val);
                }
            });

            // Поиск
            document.getElementById('searchInput').addEventListener('input', loadQuestions);

            // Фильтры по источникам
            document.getElementById('filterBar').addEventListener('click', function(e) {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.source;
                    loadQuestions();
                }
            });
        }

        function loadBaseList() {
            fetch('bases/index.json')
                .then(r => r.json())
                .then(data => {
                    extraBases = (data.bases || []).filter(b => !MAIN_BASES.includes(b));
                    renderExtraBases();
                    // Загружаем ПТБ по умолчанию
                    loadQuestionsForBase(currentBase);
                })
                .catch(() => {
                    extraBases = [];
                    renderExtraBases();
                    loadQuestionsForBase(currentBase);
                });
        }

        function renderExtraBases() {
            let select = document.getElementById('baseSelect');
            select.innerHTML = '<option value="">📁 Дополнительные базы</option>';
            extraBases.forEach(b => {
                let opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                select.appendChild(opt);
            });
        }

        function loadQuestionsForBase(baseName) {
            fetch(`bases/${baseName}.json`)
                .then(r => r.json())
                .then(data => {
                    allQuestions = data.map(q => ({
                        ...q,
                        source: q.source || baseName
                    }));
                    renderSourceFilter();
                    loadQuestions();
                })
                .catch(() => {
                    allQuestions = [];
                    renderSourceFilter();
                    loadQuestions();
                });
        }

        function getAllSources() {
            let sources = new Set();
            allQuestions.forEach(q => {
                if (q.source) sources.add(q.source);
            });
            return Array.from(sources).sort();
        }

        function renderSourceFilter() {
            let sources = getAllSources();
            let filterBar = document.getElementById('filterBar');
            
            if (sources.length === 0) {
                filterBar.innerHTML = `<button class="filter-btn active" data-source="all">📋 Все</button>`;
                return;
            }
            
            let html = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" data-source="all">📋 Все</button>`;
            sources.forEach(source => {
                let displayName = source.length > 25 ? source.substring(0, 22) + '...' : source;
                html += `<button class="filter-btn ${currentFilter === source ? 'active' : ''}" data-source="${source}">📁 ${displayName}</button>`;
            });
            filterBar.innerHTML = html;
        }

        function formatAnswer(question) {
            if (!question) return '';
            let html = '';
            if (question.all_answers) {
                question.all_answers.forEach(a => {
                    html += `<div class="${a.correct ? 'answer-correct' : 'answer-wrong'}">${a.correct ? '✅' : '❌'} ${a.text}</div>`;
                });
            } else if (question.answer) {
                if (question.answer.includes('++')) {
                    question.answer.split('\n').forEach(line => {
                        if (line.trim().startsWith('++')) {
                            html += `<div class="answer-correct">✅ ${line.replace('++', '').trim()}</div>`;
                        }
                    });
                } else {
                    html += `<div class="answer-correct">✅ ${question.answer}</div>`;
                }
            }
            return html;
        }

        function loadQuestions() {
            let filtered = currentFilter === 'all' 
                ? allQuestions 
                : allQuestions.filter(q => q.source === currentFilter);
            
            let search = document.getElementById('searchInput').value.toLowerCase().trim();
            if (search) {
                let searchWords = search.split(/\s+/).filter(word => word.length > 0);
                filtered = filtered.filter(q => {
                    let textToSearch = (
                        (q.punkt || '') + ' ' + 
                        (q.question || '') + ' ' + 
                        (q.source || '')
                    ).toLowerCase();
                    return searchWords.every(word => textToSearch.includes(word));
                });
            }
            
            document.getElementById('questionCount').textContent = filtered.length;
            
            let container = document.getElementById('questionsContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">📭 Нет вопросов</div>';
                return;
            }
            
            let html = '';
            filtered.forEach(q => {
                html += `<div class="question-item">`;
                html += `<div class="punkt">📌 ${q.punkt || ''}`;
                if (q.source) html += `<span style="color:#6c757d;font-size:11px;margin-left:8px;">[${q.source}]</span>`;
                html += `</div>`;
                html += `<div class="question">❓ ${q.question}</div>`;
                html += `<div class="answers">${formatAnswer(q)}</div>`;
                html += `</div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
