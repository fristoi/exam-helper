<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамены</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            padding: 0;
        }
        .container {
            max-width: 100%;
            margin: 0;
            background: white;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .header-left {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-btn {
            padding: 8px 20px;
            border: 2px solid #0b3b5c;
            border-radius: 30px;
            background: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: #0b3b5c;
            white-space: nowrap;
        }
        .top-btn:hover {
            background: #e2e8f0;
        }
        .top-btn.active {
            background: #0b3b5c;
            color: white;
            border-color: #0b3b5c;
        }

        /* СЧЁТЧИК */
        .count-badge {
            background: #d1d5db;
            color: #1f2937;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            flex-shrink: 0;
            border: none;
            display: inline-block;
            text-align: center;
            min-width: 80px;
        }

        .section-dropdown {
            padding: 8px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .section-dropdown select {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .filter-btn {
            padding: 6px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #0b3b5c;
        }
        .filter-btn:hover {
            background: #e2e8f0;
        }
        .filter-btn.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .search-box {
            padding: 8px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .search-box input:focus {
            border-color: #0b3b5c;
        }
        /* Крестик всегда виден */
        .search-box input::-webkit-search-cancel-button {
            display: block;
            cursor: pointer;
        }

        /* ===== ОБЛАСТЬ С ВОПРОСАМИ ===== */
        .questions-wrapper {
            background: #e5e7eb;
            padding: 16px 12px;
            min-height: 100vh;
        }
        .questions-list {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        /* ===== КАРТОЧКИ ВОПРОСОВ ===== */
        .question-item {
            background: white;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.2s;
            width: 100%;
        }
        .question-item:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .punkt {
            color: #4b5563;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .question {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .answers {
            font-size: 13px;
        }
        .answer-correct {
            color: #16a34a;
            margin-bottom: 2px;
        }
        .answer-wrong {
            color: #dc2626;
            margin-bottom: 2px;
        }
        .no-results {
            text-align: center;
            color: #6b7280;
            padding: 40px 0;
            font-size: 16px;
        }
        .hidden {
            display: none !important;
        }

        /* ===== ПОДСВЕТКА ===== */
        .highlight {
            background: #fbbf24;
            padding: 0 2px;
            border-radius: 3px;
            font-weight: 600;
            color: #1f2937;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {
            .header {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .header-left {
                flex: 1;
                justify-content: flex-start;
            }
            .count-badge {
                font-size: 13px;
                padding: 6px 14px;
                min-width: 60px;
            }
            .top-btn {
                padding: 6px 14px;
                font-size: 13px;
            }
            .section-dropdown select {
                max-width: 100%;
            }
            .question-item {
                padding: 12px 14px;
            }
            .questions-wrapper {
                padding: 12px 8px;
            }
        }

        @media (max-width: 400px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .header-left {
                justify-content: center;
            }
            .count-badge {
                text-align: center;
            }
            .top-btn {
                flex: 1;
                text-align: center;
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <div class="header-left">
                <button class="top-btn active" data-base="ПТБ">ПТБ</button>
                <button class="top-btn" data-base="ППБ">ППБ</button>
                <button class="top-btn" data-base="ПТЭ">ПТЭ</button>
            </div>
            <div class="count-badge" id="countBadge">0 вопросов</div>
        </div>

        <!-- ===== ВЫПАДАЮЩИЙ СПИСОК ===== -->
        <div class="section-dropdown" id="extraBasesContainer">
            <select id="baseSelect">
                <option value="">📁 Дополнительные базы</option>
            </select>
        </div>

        <!-- ===== ФИЛЬТР ===== -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-source="all">📋 Все</button>
        </div>

        <!-- ===== ПОИСК ===== -->
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="🔍 Найти вопрос...">
        </div>

        <!-- ===== ОБЛАСТЬ С ВОПРОСАМИ ===== -->
        <div class="questions-wrapper">
            <div class="questions-list">
                <div id="questionsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ЛОГИКА
        // ============================================================

        let currentBase = 'ПТБ';
        let allQuestions = [];
        let currentFilter = 'all';
        let extraBases = [];

        const MAIN_BASES = ['ПТБ', 'ППБ', 'ПТЭ'];

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadBaseList();
        });

        function setupEventListeners() {
            document.querySelectorAll('.top-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentBase = this.dataset.base;
                    document.getElementById('baseSelect').value = '';
                    loadQuestionsForBase(currentBase);
                });
            });

            document.getElementById('baseSelect').addEventListener('change', function() {
                let val = this.value;
                if (val) {
                    document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
                    currentBase = val;
                    loadQuestionsForBase(val);
                }
            });

            document.getElementById('searchInput').addEventListener('input', loadQuestions);

            document.getElementById('filterBar').addEventListener('click', function(e) {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.source;
                    loadQuestions();
                }
            });
        }

        function loadBaseList() {
            fetch('bases/index.json')
                .then(r => r.json())
                .then(data => {
                    extraBases = (data.bases || []).filter(b => !MAIN_BASES.includes(b));
                    renderExtraBases();
                    loadQuestionsForBase(currentBase);
                })
                .catch(() => {
                    extraBases = [];
                    renderExtraBases();
                    loadQuestionsForBase(currentBase);
                });
        }

        function renderExtraBases() {
            let select = document.getElementById('baseSelect');
            select.innerHTML = '<option value="">📁 Дополнительные базы</option>';
            extraBases.forEach(b => {
                let opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                select.appendChild(opt);
            });
        }

        function loadQuestionsForBase(baseName) {
    let filtered = currentFilter === 'all' 
        ? allQuestions 
        : allQuestions.filter(q => q.source && q.source.trim() === currentFilter);
    
    let search = document.getElementById('searchInput').value.toLowerCase().trim();
    if (search) {
        let searchWords = search.split(/\s+/);
        filtered = filtered.filter(q => {
            let txt = ((q.punkt || '') + ' ' + (q.question || '') + ' ' + (q.source || '')).toLowerCase();
            return searchWords.every(word => txt.includes(word));
        });
    }
    
    let container = document.getElementById('questionsContainer');
    if (!container) return;
    if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">📭 Вопросов нет</div>';
        return;
    }
    
    let html = '';
    let shownSources = {}; 
    let sourceCounter = 0;

    filtered.forEach(q => {
        html += `<div class="question-item">`;
        let sourceContent = '';
        if (q.source) {
            let cleanSource = q.source.trim(); 
            if (!shownSources[cleanSource]) {
                sourceCounter++; 
                shownSources[cleanSource] = sourceCounter;
                sourceContent = `<span class="source">[${q.source}]</span>`;
            } else {
                sourceContent = `<span class="source short-source" data-full="${q.source}" data-index="${shownSources[cleanSource]}" onclick="toggleSource(this)">[Источник ${shownSources[cleanSource]} ↩]</span>`;
            }
        }
        html += `<div class="punkt">📌 ${q.punkt || ''} ${sourceContent}</div>`;
        html += `<div class="question">❓ ${q.question}</div>`;
        html += `<div class="answers">${formatAnswer(q)}</div>`;
        html += `</div>`;
    });
    container.innerHTML = html;
}

// Добавляем функцию для клика по источнику
function toggleSource(element) {
    const fullText = element.getAttribute('data-full');
    const indexNum = element.getAttribute('data-index');
    if (element.classList.contains('short-source')) {
        element.textContent = `[${fullText}]`;
        element.classList.remove('short-source');
    } else {
        element.textContent = `[Источник ${indexNum} ↩]`;
        element.classList.add('short-source');
    }
}

        }

        function renderSourceFilter() {
            let sources = getAllSources();
            let filterBar = document.getElementById('filterBar');

            if (sources.length === 0) {
                filterBar.innerHTML = `<button class="filter-btn active" data-source="all">📋 Все</button>`;
                return;
            }

            let html = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" data-source="all">📋 Все</button>`;
            sources.forEach(source => {
                let displayName = source.length > 25 ? source.substring(0, 22) + '...' : source;
                html += `<button class="filter-btn ${currentFilter === source ? 'active' : ''}" data-source="${source}">📁 ${displayName}</button>`;
            });
            filterBar.innerHTML = html;
        }

        // ===== ФОРМАТИРОВАНИЕ ОТВЕТОВ =====
        function formatAnswer(question, highlightWords) {
            if (!question) return '';
            let html = '';

            if (question.all_answers) {
                question.all_answers.forEach(a => {
                    let text = a.text;
                    if (highlightWords && highlightWords.length > 0) {
                        text = highlightText(text, highlightWords);
                    }
                    html += `<div class="${a.correct ? 'answer-correct' : 'answer-wrong'}">${a.correct ? '✅' : '❌'} ${text}</div>`;
                });
            } else if (question.answer) {
                let text = question.answer;
                if (highlightWords && highlightWords.length > 0) {
                    text = highlightText(text, highlightWords);
                }
                if (question.answer.includes('++')) {
                    question.answer.split('\n').forEach(line => {
                        if (line.trim().startsWith('++')) {
                            let cleanText = line.replace('++', '').trim();
                            if (highlightWords && highlightWords.length > 0) {
                                cleanText = highlightText(cleanText, highlightWords);
                            }
                            html += `<div class="answer-correct">✅ ${cleanText}</div>`;
                        }
                    });
                } else {
                    html += `<div class="answer-correct">✅ ${text}</div>`;
                }
            }
            return html;
        }

        // ===== ПОДСВЕТКА ТЕКСТА =====
        function highlightText(text, words) {
            if (!text || !words || words.length === 0) return text;

            let result = text;
            let sortedWords = [...words].sort((a, b) => b.length - a.length);

            for (let word of sortedWords) {
                if (word.length < 1) continue;
                let escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                let regex = new RegExp('(' + escaped + ')', 'gi');
                result = result.replace(regex, '<span class="highlight">$1</span>');
            }
            return result;
        }

        function getDeclension(count) {
            if (count % 10 === 1 && count % 100 !== 11) return 'вопрос';
            if (count % 10 >= 2 && count % 10 <= 4 && (count % 100 < 10 || count % 100 >= 20)) return 'вопроса';
            return 'вопросов';
        }

        // ===== ОСНОВНАЯ ФУНКЦИЯ ЗАГРУЗКИ ВОПРОСОВ =====
        function loadQuestions() {
            let search = document.getElementById('searchInput').value.toLowerCase().trim();
            let searchWords = search ? search.split(/\s+/).filter(word => word.length > 0) : [];

            let filtered = currentFilter === 'all'
                ? allQuestions
                : allQuestions.filter(q => q.source === currentFilter);

            // ФИЛЬТРАЦИЯ (source НЕ участвует)
            if (searchWords.length > 0) {
                filtered = filtered.filter(q => {
                    let answersText = '';
                    if (q.all_answers) {
                        answersText = q.all_answers.map(a => a.text).join(' ');
                    } else if (q.answer) {
                        answersText = q.answer;
                    }

                    let textToSearch = (
                        (q.punkt || '') + ' ' +
                        (q.question || '') + ' ' +
                        answersText
                    ).toLowerCase();

                    return searchWords.every(word => textToSearch.includes(word));
                });
            }

            // СЧЁТЧИК
            const count = filtered.length;
            document.getElementById('countBadge').textContent = `${count} ${getDeclension(count)}`;

            let container = document.getElementById('questionsContainer');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">📭 Нет вопросов</div>';
                return;
            }

            // ОТОБРАЖЕНИЕ
            let html = '';
            filtered.forEach(q => {
                let punktText = q.punkt || '';
                let questionText = q.question || '';

                if (searchWords.length > 0) {
                    punktText = highlightText(punktText, searchWords);
                    questionText = highlightText(questionText, searchWords);
                }

                html += `<div class="question-item">`;
                html += `<div class="punkt">📌 ${punktText}`;
                if (q.source) {
                    // source выводится, но НЕ подсвечивается
                    html += `<span style="color:#b0b8c4;font-size:9px;margin-left:8px;">[${q.source}]</span>`;
                }
                html += `</div>`;
                html += `<div class="question">❓ ${questionText}</div>`;
                html += `<div class="answers">${formatAnswer(q, searchWords)}</div>`;
                html += `</div>`;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
